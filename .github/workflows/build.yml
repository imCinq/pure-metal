name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - name: Presentation credit tests
        run: |
          clang -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -pthread tools/test_present_credits.c -o /tmp/puremetal-present-credits
          /tmp/puremetal-present-credits
      - uses: actions/upload-artifact@v4
        with:
          name: pure-metal
          path: build/libs/*.jar
      - name: Headless terrain and hook tests
        run: python3 tools/test_terrain_lod.py
        env:
          PM_SKIP_FLUID_CARRIER_COST: "1"
